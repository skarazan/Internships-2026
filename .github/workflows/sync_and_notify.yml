name: Sync upstream and notify Discord

on:
  schedule:
    # Safety net only. GitHub throttles high-frequency crons on shared runners,
    # so */5 here was really delivering every 45-60 min. Fast cadence comes from
    # an external scheduler calling the workflow_dispatch API.
    - cron: '*/30 * * * *'
  workflow_dispatch: # manual trigger

concurrency:
  group: sync-notify
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync filter and detect changes
        id: sync
        run: python3 .github/scripts/sync_and_notify.py

      # Runs before the commit: if Discord is down, the notified hashes are not
      # persisted, so the listings are retried on the next run instead of being
      # silently marked as sent.
      - name: Notify Discord
        if: steps.sync.outputs.has_changes == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -c '.[]' .github/scripts/discord_chunks.json | while read -r chunk; do
            jq -n --argjson content "$chunk" '{"content": $content}' | \
              curl -sS --fail-with-body -H "Content-Type: application/json" \
                -d @- "$DISCORD_WEBHOOK_URL"
            sleep 1
          done

      - name: Commit changes
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/data/filtered_jobs.json .github/data/notified_hashes.json
          git diff-index --quiet HEAD || git commit -m "Sync upstream: new SWE/Data listings in NYC/Remote"
          git push
